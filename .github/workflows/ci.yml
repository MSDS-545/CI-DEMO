name: Minimal CI - Tests, Coverage, Security, Dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # CI quality gate: a failing test OR coverage below 85% fails the job.
      - name: Run tests + enforce 85% coverage gate
        run: |
          python -m pytest \
            --junitxml=test_results.xml \
            --cov=app \
            --cov-fail-under=85 \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v

      # These two scans are intentionally report-only for this teaching demo.
      # Remove "|| true" later to demonstrate a blocking DevSecOps gate.
      - name: Run Bandit security scan (report-only)
        run: |
          bandit -r app -f json -o bandit.json || true

      - name: Run dependency audit (report-only)
        run: |
          pip-audit -f json -o dependencies.json || true

      - name: Generate consolidated HTML dashboard
        run: |
          python generate_dashboard.py

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload security reports + dashboard
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            test_results.xml
            coverage.xml
            bandit.json
            dependencies.json
            security_dashboard.html
