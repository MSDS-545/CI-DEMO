name: Publish Security Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Deployment is allowed only after tests pass and coverage is >= 85%.
      - name: Run tests + enforce 85% coverage gate
        run: |
          python -m pytest \
            --junitxml=test_results.xml \
            --cov=app \
            --cov-fail-under=85 \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v

      # Report-only security checks for the classroom demo.
      - name: Run security reports
        run: |
          bandit -r app -f json -o bandit.json 
          pip-audit -f json -o dependencies.json 
          python generate_dashboard.py

      - name: Prepare site
        run: |
          mkdir -p site
          cp security_dashboard.html site/index.html
          cp -r htmlcov site/htmlcov

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
